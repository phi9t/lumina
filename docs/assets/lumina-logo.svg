    <circle cx="36" cy="106" r="8" fill="#e879f9"/>

    <circle cx="36" cy="148" r="19" fill="#0d1420" stroke="#ff007f" stroke-width="4"/>
    <path d="M25 148h22M36 137v22" stroke="#f8fafc" stroke-width="3.5" stroke-linecap="round"/>
