<svg xmlns="http://www.w3.org/2000/svg" width="760" height="200" viewBox="0 0 760 200" role="img" aria-labelledby="title desc">
  <title id="title">Lumina logo</title>
  <desc id="desc">Minimal residual-stream mark and wordmark for Lumina, a transformer layer explorer.</desc>
  <defs>
    <linearGradient id="plateFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101826"/>
      <stop offset="1" stop-color="#0b111c"/>
    </linearGradient>
  </defs>

  <rect width="760" height="200" rx="18" fill="#080a10"/>
  <rect x="0.5" y="0.5" width="759" height="199" rx="17.5" fill="none" stroke="#1f2937"/>

  <g transform="translate(104 36)">
    <path d="M36 2v124" stroke="#475569" stroke-width="7" stroke-linecap="round"/>

    <rect x="88" y="14" width="142" height="52" rx="9" fill="url(#plateFill)" stroke="#38bdf8" stroke-width="3"/>
    <rect x="88" y="72" width="142" height="52" rx="9" fill="url(#plateFill)" stroke="#e879f9" stroke-width="3"/>

    <path d="M36 40H88" stroke="#22d3ee" stroke-width="5" stroke-linecap="round"/>
    <path d="M36 98H88" stroke="#e879f9" stroke-width="5" stroke-linecap="round"/>

    <circle cx="36" cy="40" r="8" fill="#22d3ee"/>
    <circle cx="36" cy="98" r="8" fill="#e879f9"/>
  </g>

  <g transform="translate(372 58)">
    <text x="0" y="58" fill="#f8fafc" font-family="'Fira Code', 'FiraCode Nerd Font', ui-monospace, monospace" font-size="64" font-weight="700">Lumina</text>
    <text x="4" y="98" fill="#94a3b8" font-family="'Fira Code', 'FiraCode Nerd Font', ui-monospace, monospace" font-size="16" letter-spacing="2.8">TRANSFORMER LAYER EXPLORER</text>
  </g>
</svg>
